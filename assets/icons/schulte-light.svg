    <rect x="9" y="9" width="14" height="14" rx="3"/><rect x="25" y="9" width="14" height="14" rx="3"/>
    <rect x="41" y="25" width="14" height="14" rx="3"/><rect x="9" y="41" width="14" height="14" rx="3"/>
    <rect x="25" y="41" width="14" height="14" rx="3"/><rect x="41" y="41" width="14" height="14" rx="3"/>
    <rect x="9" y="25" width="14" height="14" rx="3"/>
  </g>
  <rect x="41" y="9" width="14" height="14" rx="3" fill="#9bd72f" stroke="#1d2b12" stroke-width="1.6"/>
  <rect x="25" y="25" width="14" height="14" rx="3" fill="#ffb02e" stroke="#1d2b12" stroke-width="1.6"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#1d2b12">
    <text x="16" y="19.5">7</text><text x="32" y="19.5">4</text>
    <text x="16" y="35.5">9</text><text x="48" y="35.5">5</text>
    <text x="16" y="51.5">3</text><text x="32" y="51.5">8</text><text x="48" y="51.5">6</text>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#1d2b12">
    <text x="48" y="19.5">1</text><text x="32" y="35.5">2</text>
  </g>
</svg>
