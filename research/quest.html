<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/quest.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/quest-32.png">
    <link rel="apple-touch-icon" href="../assets/icons/quest-180.png">
    <title>研究闖關｜果汁龍的研究</title>
    <meta name="description" content="把 31 個資料探勘互動 Demo 的練習模式串成闖關地圖：照閱讀路線一關一關答題，答滿 5 題過關，答對率決定星星。">
    <meta name="jfk-paint" content="off"><!-- 兩種主題的顏色都寫在下面 -->
    <script src="../assets/theme.js"></script>
    <link rel="stylesheet" href="../assets/theme.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        /* 手機瀏覽器會自動把某些段落的字放大；關掉它 */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        :root {
            --bg: #05050a;
            --panel: #0f0f1a;
            --panel-2: #151527;
            --border: #262640;
            --text: #e6e6f0;
            --muted: #8a8aa3;
            --accent: #7c3aed;
            --accent2: #06b6d4;
            --gold: #facc15;
            --ink: #e6e6f0;
            --node: #151527;
            --track: #2a2a48;
        }
        :root[data-theme="light"] {
            --gold: #ffb02e;
            --ink: #1d2b12;
            --node: #ffffff;
            --track: #b9c9a6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }
        .wrap { max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
        .back {
            display: inline-block; color: var(--muted); text-decoration: none;
            font: 0.8rem 'Space Mono', monospace; letter-spacing: 0.05em; margin-bottom: 1rem;
        }
        .back:hover { color: var(--accent2); }
        .kicker { font: 0.75rem 'Space Mono', monospace; color: var(--accent2); letter-spacing: 0.1em; }
        h1 { font-family: 'Syne', sans-serif; font-size: clamp(1.7rem, 7vw, 2.6rem); line-height: 1.15; margin: 0.2rem 0 0.5rem; }
        .lead { color: var(--muted); font-size: 0.95rem; }

        /* ── 自己的成績 ── */
        .me {
            margin: 1.2rem 0 0.4rem; padding: 1rem 1.1rem; border-radius: 16px;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(6, 182, 212, 0.12)), var(--panel);
            border: 1px solid var(--border);
        }
        [data-theme="light"] .me { background: #fff8e6; border: 3px solid #1d2b12; box-shadow: 5px 5px 0 #1d2b12; }
        .me .rank { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; }
        .me .rank b { font-size: 1.25rem; }
        .me .rank small { color: var(--muted); font-size: 0.82rem; }
        .bar { height: 12px; border-radius: 999px; background: var(--track); margin: 0.55rem 0 0.7rem; overflow: hidden; }
        .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.6s; }
        [data-theme="light"] .bar { border: 2px solid #1d2b12; height: 16px; background: #fff; }
        [data-theme="light"] .bar i { background: #ffb02e; }
        .nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.4rem; text-align: center; }
        .nums div { min-width: 0; }
        .nums b { display: block; font: 700 1.15rem 'Space Mono', monospace; }
        .nums span { font-size: 0.75rem; color: var(--muted); }
        .go-next {
            display: flex; align-items: center; justify-content: center; gap: 0.4rem; margin-top: 0.9rem; padding: 0.65rem 1rem;
            border-radius: 12px; text-decoration: none; font-weight: 700; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }
        [data-theme="light"] .go-next { background: #ffb02e; color: #1d2b12; border: 2.5px solid #1d2b12; box-shadow: 3px 3px 0 #1d2b12; }
        .go-next span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .rules { font-size: 0.85rem; color: var(--muted); margin: 0.8rem 0 0; }

        /* ── 世界（一條閱讀路線）── */
        .world { margin-top: 2.2rem; }
        .world-head { display: flex; align-items: center; gap: 0.7rem; padding-bottom: 0.4rem; border-bottom: 1px dashed var(--border); }
        [data-theme="light"] .world-head { border-bottom: 2px dashed #1d2b12; }
        .world-no {
            flex: none; width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center;
            font: 700 1rem 'Space Mono', monospace; color: #fff; background: var(--c);
        }
        [data-theme="light"] .world-no { border: 2.5px solid #1d2b12; color: #1d2b12; }
        .world-head h2 { font-size: 1.12rem; line-height: 1.3; }
        [data-theme="light"] .world-head h2 { font-family: 'Noto Sans TC', sans-serif; font-weight: 900; }
        .world-head p { font-size: 0.82rem; color: var(--muted); }
        .world-head .wst { margin-left: auto; flex: none; font: 700 0.85rem 'Space Mono', monospace; color: var(--gold); white-space: nowrap; }
        [data-theme="light"] .world-head .wst { color: #b45309; }

        .path { position: relative; padding: 0.6rem 0; }
        .path svg.track { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
        .track path { fill: none; stroke: var(--track); stroke-width: 5; stroke-dasharray: 1 11; stroke-linecap: round; }
        .track path.done { stroke: var(--c); stroke-dasharray: none; stroke-width: 4; opacity: 0.8; }

        /* 關卡左右輕輕擺動（--x），說明一律在圓圈右邊，連線才不會穿過字 */
        .stage {
            position: relative; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 0.8rem; align-items: center;
            margin: 1rem 0 1rem var(--x, 0px); text-decoration: none; color: inherit;
        }
        .node {
            position: relative; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center;
            background: var(--node); border: 3px solid var(--border); transition: transform 0.15s;
        }
        .stage:hover .node { transform: scale(1.06); }
        .node img { width: 40px; height: 40px; border-radius: 9px; }
        [data-theme="light"] .node { border: 3px solid #1d2b12; box-shadow: 3px 3px 0 #1d2b12; }
        .stage.clear .node { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.18); }
        [data-theme="light"] .stage.clear .node { border-color: #1d2b12; background: #ffe3a8; box-shadow: 3px 3px 0 #1d2b12; }
        .stage.next .node { border-color: var(--c); animation: glow 1.6s ease-in-out infinite; }
        [data-theme="light"] .stage.next .node { border-color: #1d2b12; background: #e9f7d9; }
        @keyframes glow { 50% { box-shadow: 0 0 0 9px rgba(124, 58, 237, 0.0), 0 0 22px 2px var(--c); } }
        .node .st {
            position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%); white-space: nowrap;
            font-size: 0.8rem; letter-spacing: -1px; color: var(--gold); text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
            background: var(--bg); padding: 0 4px; border-radius: 6px; line-height: 1.3;
        }
        [data-theme="light"] .node .st { color: #e8a000; text-shadow: none; -webkit-text-stroke: 0.6px #1d2b12; background: #e9f7d9; }
        .node .flag {
            position: absolute; top: -13px; left: 50%; transform: translateX(-50%); font-size: 0.68rem; font-weight: 700; white-space: nowrap;
            padding: 1px 7px; border-radius: 999px; color: #fff; background: var(--c);
        }
        [data-theme="light"] .node .flag { color: #1d2b12; border: 2px solid #1d2b12; }
        .stage .info { min-width: 0; }
        .stage .info > span { display: block; }
        .stage .name { font-weight: 700; line-height: 1.35; }
        .stage .hint { font-size: 0.82rem; color: var(--muted); line-height: 1.45; margin-top: 0.1rem; }
        .stage .stat { font: 0.75rem 'Space Mono', monospace; color: var(--muted); margin-top: 0.15rem; }
        .stage.clear .stat { color: var(--gold); }
        [data-theme="light"] .stage.clear .stat { color: #b45309; }
        .stage.flash .node { animation: flash 0.5s ease-in-out 3; }
        @keyframes flash { 50% { transform: scale(1.15); } }

        .foot { margin-top: 2.4rem; display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
        .reset { font: inherit; font-size: 0.8rem; padding: 0.3rem 0.8rem; border-radius: 8px; cursor: pointer; color: var(--muted); background: none; border: 1px solid var(--border); }
        .reset.armed { color: #f87171; border-color: #f87171; }
        [data-theme="light"] .reset { border: 2px solid #1d2b12; color: #1d2b12; }
        [data-theme="light"] .reset.armed { color: #d93a2f; border-color: #d93a2f; }

        @media (prefers-reduced-motion: reduce) {
            .stage.next .node, .stage.flash .node { animation: none; }
            .bar i { transition: none; }
        }
        @media (max-width: 380px) {
            .stage { grid-template-columns: 64px minmax(0, 1fr); gap: 0.6rem; }
            .node { width: 64px; height: 64px; }
            .node img { width: 34px; height: 34px; }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="../index.html#research">← RETURN TO PORTFOLIO</a>
        <div class="kicker">// RESEARCH QUEST</div>
        <h1>研究闖關</h1>
        <p class="lead">31 個研究 Demo 都有「🎯 練習模式」：按下一步之前先猜演算法接下來會做什麼。這裡把它們照閱讀路線排成關卡，從 Apriori 一路打到論文關。</p>

        <section class="me" aria-label="我的成績">
            <div class="rank"><b id="rank">新手果汁龍</b><small id="rank-next"></small></div>
            <div class="bar" role="progressbar" aria-label="星星" aria-valuemin="0" id="bar"><i id="bar-fill"></i></div>
            <div class="nums">
                <div><b id="n-stars">0</b><span>星星</span></div>
                <div><b id="n-clear">0</b><span>過關</span></div>
                <div><b id="n-ans">0</b><span>答過的題</span></div>
                <div><b id="n-acc">—</b><span>答對率</span></div>
            </div>
            <a class="go-next" id="go-next" href="apriori.html?quiz=1"><span id="go-next-text">從第一關開始 →</span></a>
            <p class="rules">一次打開關卡答滿 <b>5</b> 題、答對一半以上就過關，答對率決定星星：50% 以上 ★、70% 以上 ★★、90% 以上 ★★★。答不夠好就繼續答，答對率會一直重算。可以重打刷星星。紀錄只存在這台裝置的瀏覽器裡。</p>
        </section>

        <div id="worlds"></div>

        <div class="foot">
            <span>直接在 Demo 頁打開練習模式答題也會算進來。</span>
            <button type="button" class="reset" id="reset">清除闖關紀錄</button>
        </div>
    </div>

    <script>
        (function () {
            var KEY = 'jfk-quest-v1';
            // 關卡：照研究地圖（research/overview.html）的閱讀路線排；新增 Demo 時加到適合的世界
            // [頁面, 名稱, 一句話]
            var WORLDS = [
                { title: '入門路線', sub: '頻繁樣式的三種基本做法，再往外延伸', c: '#8b5cf6', stages: [
                    ['apriori', 'Apriori', '支持度和向下封閉性，每一關的共同語言'],
                    ['fp-growth', 'FP-Growth', '交易壓進 FP-tree，只掃兩次'],
                    ['eclat', 'Eclat', '垂直格式，交集就是支持度'],
                    ['closed-patterns', 'CHARM 封閉樣式', '樣式太多？只留封閉的'],
                    ['association-rules', '關聯規則', '買了 X 的人也會買 Y 嗎？'],
                    ['prefixspan', 'PrefixSpan', '加上先後順序變成序列樣式']
                ] },
                { title: '高效益路線', sub: '不只看買幾次，還看賺多少', c: '#f59e0b', stages: [
                    ['two-phase', 'Two-Phase', 'TWU 上界先篩候選，再算效益'],
                    ['up-growth', 'UP-Growth', '換成樹，上界收得更緊'],
                    ['high-utility', 'HUI-Miner', 'utility list，合併就算出效益'],
                    ['efim', 'EFIM', '投影資料庫加更緊的上界'],
                    ['top-k-hui', 'Top-k', '不設門檻，直接要前 k 名']
                ] },
                { title: '串流與空間路線', sub: '資料停不下來，或資料有位置', c: '#06b6d4', stages: [
                    ['sliding-window', '滑動視窗', '只看最近 W 筆，一進一出'],
                    ['stream-counting', 'Lossy Counting・Space-Saving', '記憶體不夠時近似計數'],
                    ['count-min', 'Count-Min Sketch', '只記格子不記名稱'],
                    ['spatial', '四元樹與共位樣式', '哪幾種店總是開在彼此附近'],
                    ['rtree', 'R-tree 與 kNN', '找最近的 k 家店'],
                    ['dbscan', 'DBSCAN', '用密度把點分群']
                ] },
                { title: '番外：序列、圖形與增量', sub: '入門和高效益路線走完之後', c: '#22c55e', stages: [
                    ['gsp-spade', 'GSP 與 SPADE', '序列樣式的另外兩種做法'],
                    ['gspan', 'gSpan', '找出常見的子圖'],
                    ['periodic', 'PFP-tree 週期樣式', '還看隔多久出現一次'],
                    ['uspan', 'USpan', '有先後順序，又要最賺錢'],
                    ['incremental', 'FUP 增量探勘', '新交易進來不用全部重算'],
                    ['cantree', 'CanTree', '固定順序插入，不用重建'],
                    ['ihup', 'IHUP', '高效益樣式也能邊加邊挖'],
                    ['foth', '📄 FOTH', '論文關：不用 join 的高效益樣式']
                ] },
                { title: '番外：串流與空間進階', sub: '機率資料結構、論文和進階查詢', c: '#60a5fa', stages: [
                    ['bloom-filter', 'Bloom Filter', '這張發票登錄過了沒？'],
                    ['hyperloglog', 'HyperLogLog', '來了幾位不同的會員？'],
                    ['skyline', 'Skyline', '又便宜又近的店有哪些'],
                    ['ir-tree', 'IR-tree', '最近、又有賣咖啡的店'],
                    ['sw-huop', '📄 HUOPS', '論文關：滑動視窗高效益佔有率'],
                    ['uncertain-sw', '📄 SWUPA', '論文關：滑動視窗不確定樣式']
                ] }
            ];
            var RANKS = [[0, '新手果汁龍'], [5, '實驗室新生'], [20, '大學專題生'], [40, '碩士生'], [65, '博士生'], [85, '資料探勘教授'], [93, '傳說中的果汁龍']];
            var ALL = [];
            WORLDS.forEach(function (w) { w.stages.forEach(function (s) { ALL.push(s[0]); }); });
            var MAXSTARS = ALL.length * 3;
            var $ = function (id) { return document.getElementById(id); };
            var light = function () { return document.documentElement.dataset.theme === 'light'; };

            function load() {
                try { var s = JSON.parse(localStorage.getItem(KEY) || '{}'); return s && s.pages && typeof s.pages === 'object' ? s.pages : {}; }
                catch (e) { return {}; }
            }
            function el(tag, cls, text) {
                var e = document.createElement(tag);
                if (cls) e.className = cls;
                if (text != null) e.textContent = text;
                return e;
            }
            function starStr(n) { return '★★★'.slice(0, n) + '☆☆☆'.slice(n); }

            function render() {
                var data = load();
                var stars = 0, clear = 0, ans = 0, right = 0, next = null;
                ALL.forEach(function (p) {
                    var d = data[p];
                    if (!d) return;
                    stars += d.stars || 0;
                    if (d.stars) clear++;
                    ans += d.a || 0;
                    right += d.r || 0;
                });
                // 推薦的下一關：照順序第一個還沒過關的
                for (var i = 0; i < ALL.length; i++) if (!(data[ALL[i]] && data[ALL[i]].stars)) { next = ALL[i]; break; }

                var rank = RANKS[0], up = null;
                RANKS.forEach(function (r, k) { if (stars >= r[0]) { rank = r; up = RANKS[k + 1] || null; } });
                $('rank').textContent = rank[1];
                $('rank-next').textContent = up ? '再 ' + (up[0] - stars) + ' 顆星升級「' + up[1] + '」' : '全部三星，太強了';
                $('bar-fill').style.width = (stars / MAXSTARS * 100).toFixed(1) + '%';
                $('bar').setAttribute('aria-valuemax', MAXSTARS);
                $('bar').setAttribute('aria-valuenow', stars);
                $('n-stars').textContent = stars + '/' + MAXSTARS;
                $('n-clear').textContent = clear + '/' + ALL.length;
                $('n-ans').textContent = ans;
                $('n-acc').textContent = ans ? Math.round(right / ans * 100) + '%' : '—';
                var nameOf = {};
                WORLDS.forEach(function (w) { w.stages.forEach(function (s) { nameOf[s[0]] = s[1]; }); });
                if (next) {
                    $('go-next').href = next + '.html?quiz=1';
                    $('go-next-text').textContent = (clear ? '下一關：' : '從第一關開始：') + nameOf[next] + ' →';
                } else {
                    // 全破了：去刷星星最少的那關
                    var low = ALL.slice().sort(function (a, b) { return data[a].stars - data[b].stars; })[0];
                    $('go-next').href = low + '.html?quiz=1';
                    $('go-next-text').textContent = '全部過關！去刷 ' + nameOf[low] + ' 的星星 →';
                }

                var box = $('worlds');
                box.textContent = '';
                WORLDS.forEach(function (w, wi) {
                    var sec = el('section', 'world');
                    sec.style.setProperty('--c', w.c);
                    var head = el('div', 'world-head');
                    head.appendChild(el('span', 'world-no', String(wi + 1)));
                    var ht = el('div');
                    ht.appendChild(el('h2', null, w.title));
                    ht.appendChild(el('p', null, w.sub));
                    head.appendChild(ht);
                    var ws = 0;
                    w.stages.forEach(function (s) { ws += (data[s[0]] && data[s[0]].stars) || 0; });
                    head.appendChild(el('span', 'wst', '★ ' + ws + '/' + w.stages.length * 3));
                    sec.appendChild(head);

                    var path = el('div', 'path');
                    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('class', 'track');
                    svg.setAttribute('aria-hidden', 'true');
                    path.appendChild(svg);
                    w.stages.forEach(function (s, si) {
                        var d = data[s[0]] || {};
                        var a = el('a', 'stage' + (d.stars ? ' clear' : '') + (s[0] === next ? ' next' : ''));
                        a.style.setProperty('--x', [0, 1.6, 3.2, 1.6][si % 4] + 'rem');
                        a.href = s[0] + '.html?quiz=1';
                        a.id = 'st-' + s[0];
                        var node = el('span', 'node');
                        var img = el('img');
                        img.src = '../assets/icons/' + s[0] + (light() ? '-light' : '') + '.svg';
                        img.alt = '';
                        node.appendChild(img);
                        if (d.stars) node.appendChild(el('span', 'st', starStr(d.stars)));
                        if (s[0] === next) node.appendChild(el('span', 'flag', clear ? '下一關' : '從這裡開始'));
                        a.appendChild(node);
                        var info = el('span', 'info');
                        info.appendChild(el('span', 'name', s[1]));
                        info.appendChild(el('span', 'hint', s[2]));
                        info.appendChild(el('span', 'stat', d.stars ? '過關 · 答過 ' + d.a + ' 題' : d.a ? '答過 ' + d.a + ' 題，還沒過關' : '還沒挑戰'));
                        a.appendChild(info);
                        path.appendChild(a);
                    });
                    sec.appendChild(path);
                    box.appendChild(sec);
                });
                drawTracks();
            }

            // 關卡之間的虛線：量每個圓圈的中心，畫 S 形曲線；兩端都過關就畫成實線
            function drawTracks() {
                document.querySelectorAll('.path').forEach(function (path) {
                    var svg = path.querySelector('svg');
                    var box = path.getBoundingClientRect();
                    var nodes = path.querySelectorAll('.stage');
                    var out = '';
                    for (var i = 1; i < nodes.length; i++) {
                        var a = nodes[i - 1].querySelector('.node').getBoundingClientRect();
                        var b = nodes[i].querySelector('.node').getBoundingClientRect();
                        var x1 = a.left + a.width / 2 - box.left, y1 = a.top + a.height / 2 - box.top;
                        var x2 = b.left + b.width / 2 - box.left, y2 = b.top + b.height / 2 - box.top;
                        var my = (y1 + y2) / 2;
                        var done = nodes[i - 1].classList.contains('clear') && nodes[i].classList.contains('clear');
                        out += '<path' + (done ? ' class="done"' : '') + ' d="M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + my + ' ' + x2 + ' ' + my + ' ' + x2 + ' ' + y2 + '"/>';
                    }
                    svg.innerHTML = out;
                });
            }

            function focusHash() {
                var id = decodeURIComponent(location.hash.slice(1));
                var t = id && document.getElementById('st-' + id);
                if (!t) return;
                t.scrollIntoView({ block: 'center' });
                t.classList.remove('flash');
                void t.offsetWidth;
                t.classList.add('flash');
            }

            var armed = 0;
            $('reset').addEventListener('click', function () {
                var btn = $('reset');
                if (!btn.classList.contains('armed')) {
                    btn.classList.add('armed');
                    btn.textContent = '再按一次確定清除';
                    clearTimeout(armed);
                    armed = setTimeout(function () { btn.classList.remove('armed'); btn.textContent = '清除闖關紀錄'; }, 4000);
                    return;
                }
                clearTimeout(armed);
                try { localStorage.removeItem(KEY); } catch (e) { /* 沒存過就沒什麼好清的 */ }
                btn.classList.remove('armed');
                btn.textContent = '清除闖關紀錄';
                render();
            });

            render();
            focusHash();
            window.addEventListener('resize', drawTracks);
            document.addEventListener('themechange', render);
            // 從關卡按上一頁回來（bfcache）或別的分頁答完題，重新讀紀錄
            window.addEventListener('pageshow', function (e) { if (e.persisted) render(); });
            window.addEventListener('storage', function (e) { if (e.key === KEY) render(); });
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawTracks);
        })();
    </script>
</body>

</html>
